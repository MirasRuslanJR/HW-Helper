<!doctype html>
<html lang="kz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Үй тапсырмалары — Homework Helper</title>
  <meta name="description" content="Үй тапсырмаларын басқару — қарапайым және қауіпсіз" />
  <style>
    :root{
      --bg:#f0f4f8; --card:#ffffff; --muted:#64748b; --primary:#3b82f6; --primary-dark:#2563eb;
      --success:#10b981; --danger:#ef4444; --warning:#f59e0b; --info:#06b6d4;
      --border:rgba(15,23,42,0.08); --shadow:rgba(15,23,42,0.05);
      --gradient-1:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      --gradient-2:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);
      --gradient-3:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);line-height:1.6}
    body{padding:20px}
    @keyframes loaderBounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-20px) scale(1.1); }
}
    /* WRAPPER */
    .wrap{max-width:1400px;margin:0 auto;animation:fadeIn 0.4s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    
    /* HEADER */
    header{background:var(--card);border-radius:16px;padding:20px 24px;box-shadow:0 2px 8px var(--shadow),0 8px 24px rgba(59,130,246,0.08);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:14px}
    #logo-img{width:56px;height:56px;border-radius:12px;background:var(--gradient-1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:24px;box-shadow:0 4px 12px rgba(102,126,234,0.3)}
    h1{font-size:22px;font-weight:700;color:#0f172a}
    .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .thetitle{color: #c8c8c8;}
    /* BUTTONS */
    .btn{padding:10px 18px;border-radius:10px;border:0;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;font-size:14px;transition:all 0.2s;box-shadow:0 2px 4px rgba(59,130,246,0.2);font-family:inherit}
    .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,0.4);background:var(--primary-dark)}
    .btn:active{transform:translateY(0)}
    .btn:disabled{opacity:0.6;cursor:not-allowed}
    .btn.ghost{background:transparent;color:var(--primary);border:1px solid rgba(59,130,246,0.2);box-shadow:none}
    .btn.ghost:hover:not(:disabled){background:rgba(59,130,246,0.05);border-color:var(--primary)}
    .btn.success{background:var(--success);box-shadow:0 2px 4px rgba(16,185,129,0.2)}
    .btn.success:hover{background:#059669}
    .btn.danger{background:var(--danger);box-shadow:0 2px 4px rgba(239,68,68,0.2)}
    .btn.danger:hover{background:#dc2626}
    
    /* BADGES */
    .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;background:rgba(59,130,246,0.1);color:var(--primary)}
    .badge.success{background:rgba(16,185,129,0.1);color:var(--success)}
    .badge.warning{background:rgba(245,158,11,0.1);color:var(--warning)}
    .badge.gold{background:linear-gradient(135deg,#ffd700,#ffed4e);color:#854d0e;box-shadow:0 2px 8px rgba(255,215,0,0.3)}

.theme-purple { --primary: #a855f7; --primary-dark: #9333ea; --gradient-1: linear-gradient(135deg, #c084fc 0%, #9333ea 100%); }
.theme-black { --primary: #404040; --primary-dark: #262626; --gradient-1: linear-gradient(135deg, #525252 0%, #171717 100%); }
.theme-red { --primary: #ef4444; --primary-dark: #dc2626; --gradient-1: linear-gradient(135deg, #f87171 0%, #dc2626 100%); }
.theme-green { --primary: #10b981; --primary-dark: #059669; --gradient-1: linear-gradient(135deg, #34d399 0%, #059669 100%); }
.theme-orange { --primary: #f97316; --primary-dark: #ea580c; --gradient-1: linear-gradient(135deg, #fb923c 0%, #ea580c 100%); }
.theme-pink { --primary: #ec4899; --primary-dark: #db2777; --gradient-1: linear-gradient(135deg, #f9a8d4 0%, #db2777 100%); }
.theme-cyan { --primary: #06b6d4; --primary-dark: #0891b2; --gradient-1: linear-gradient(135deg, #22d3ee 0%, #0891b2 100%); }
.theme-gold { --primary: #f59e0b; --primary-dark: #d97706; --gradient-1: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }

/* Аватарки */
.avatar-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; margin: 16px 0; }
.avatar-option { width: 70px; height: 70px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-size: 36px; background: var(--card); }
.avatar-option:hover { transform: scale(1.1); border-color: var(--primary); }
.avatar-option.selected { border-color: var(--primary); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
.avatar-option.locked { opacity: 0.5; cursor: not-allowed; position: relative; }
.avatar-option.locked::after { content: '🔒'; position: absolute; bottom: -5px; right: -5px; font-size: 18px; }

/* Улучшенные значки */
.badge-showcase { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.badge-large { padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.badge-legendary { background: linear-gradient(135deg, #ffd700, #ffed4e); color: #854d0e; animation: badgePulse 2s infinite; }
.badge-epic { background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; }
.badge-rare { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
.badge-common { background: linear-gradient(135deg, #64748b, #475569); color: #fff; }
@keyframes badgePulse { 0%, 100% { box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3); } 50% { box-shadow: 0 4px 16px rgba(255, 215, 0, 0.6); } }

/* Рарность призов */
.rarity-legendary { border-left: 4px solid #ffd700; background: linear-gradient(90deg, rgba(255, 215, 0, 0.1), transparent); }
.rarity-epic { border-left: 4px solid #a855f7; background: linear-gradient(90deg, rgba(168, 85, 247, 0.1), transparent); }
.rarity-rare { border-left: 4px solid #3b82f6; background: linear-gradient(90deg, rgba(59, 130, 246, 0.1), transparent); }
.rarity-common { border-left: 4px solid #64748b; background: linear-gradient(90deg, rgba(100, 116, 139, 0.1), transparent); }

/* Анимация открытия кейса */
.case-opening { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 200; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.3s; }
.case-box { width: 200px; height: 200px; background: var(--gradient-1); border-radius: 20px; animation: caseShake 0.5s infinite; display: flex; align-items: center; justify-content: center; font-size: 80px; box-shadow: 0 20px 60px rgba(59, 130, 246, 0.6); }
@keyframes caseShake { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
.prize-reveal { animation: prizeReveal 0.6s ease; }
@keyframes prizeReveal { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
    /* TYPOGRAPHY */
    .small{font-size:13px;color:var(--muted)}
    .muted-italic{color:var(--muted);font-style:italic;font-size:13px}
    /* LAYOUT */
    .main{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:20px}
    
    /* SIDEBAR */
    .sidebar{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 8px var(--shadow);height:fit-content;position:sticky;top:20px}
    .section-title{font-size:14px;font-weight:600;color:#cfcfcf;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .search{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
    input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:14px;font-family:inherit;transition:all 0.2s;background:var(--card)}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
    textarea{min-height:100px;resize:vertical}
    
    /* SUBJECT LIST */
    .subject-list{display:flex;flex-direction:column;gap:6px}
    .subject-item{padding:10px 14px;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid transparent;transition:all 0.2s;display:flex;align-items:center;gap:8px}
    .subject-item:hover{background:rgba(59,130,246,0.05)}
    .subject-item.active{background:linear-gradient(135deg,rgba(59,130,246,0.1),rgba(59,130,246,0.05));border-color:rgba(59,130,246,0.2);color:var(--primary);font-weight:600}
    
    /* LEADERBOARD */
    .leaderboard{background:linear-gradient(135deg,rgba(59,130,246,0.05),rgba(139,92,246,0.05));border-radius:12px;padding:16px;margin-top:20px}
    .leaderboard .item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;margin-bottom:4px;background:var(--card);transition:all 0.2s}
    .leaderboard .item:hover{transform:translateX(4px);box-shadow:0 2px 8px var(--shadow)}
    .rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-right:8px}
    .rank-1{background:linear-gradient(135deg,#ffd700,#ffed4e);color:#854d0e}
    .rank-2{background:linear-gradient(135deg,#c0c0c0,#e8e8e8);color:#525252}
    .rank-3{background:linear-gradient(135deg,#cd7f32,#e8a87c);color:#fff}
    
    /* CONTENT */
    .content{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 2px 8px var(--shadow)}
    .content-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid rgba(59,130,246,0.1)}
    
    /* CARD */
    .card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);box-shadow:0 2px 6px var(--shadow);transition:all 0.3s}
    
    /* HOMEWORK LIST */
    .hw-list{display:grid;gap:16px}
    .hw{padding:20px;border-radius:14px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(255,255,255,0.9),rgba(248,250,252,0.9));transition:all 0.3s;position:relative;overflow:hidden}
    .hw::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gradient-3);opacity:0;transition:opacity 0.3s}
    .hw:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.3)}
    .hw:hover::before{opacity:1}
    .hw-header{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:12px}
    .hw .title{font-size:18px;font-weight:700;color:#0f172a;margin-bottom:6px}
    .hw .meta-info{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .hw .desc{color:var(--muted);font-size:14px;margin:12px 0;line-height:1.6}
    .hw .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--border)}
    
    /* COMPLETE BUTTON */
    .complete-btn{padding:10px 16px;border-radius:10px;border:1px solid var(--border);cursor:pointer;background:#fff;transition:all 0.2s;font-weight:600;font-size:14px}
    .complete-btn:hover:not(:disabled){background:rgba(16,185,129,0.05);border-color:var(--success);transform:translateY(-2px)}
    .complete-btn.done{background:var(--success);color:#fff;border:none;box-shadow:0 4px 12px rgba(16,185,129,0.3)}
    .complete-btn.done:hover{background:#059669}
    
    /* AUTH */
    .auth-card{max-width:480px;margin:60px auto;padding:32px;border-radius:16px;background:var(--card);box-shadow:0 8px 32px rgba(59,130,246,0.15);border:1px solid var(--border)}
    .auth-card h3{font-size:24px;margin-bottom:8px}
    
    /* MODALS */
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn 0.2s}
    .modal{background:var(--card);border-radius:16px;padding:24px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:slideUp 0.3s ease}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .modal h4{font-size:20px;margin-bottom:16px;color:#0f172a}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
    
    /* Snow layer (фиксирован поверх страницы) */
#snow-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 9999;
}

/* Одиночная снежинка */
#snow-layer .snow {
  position: absolute;
  left: 0; /* старт в левом краю, реальная позиция задаётся через translate(var(--x-start)) */
  top: 0;
  width: var(--size, 8px);
  height: var(--size, 8px);
  background: var(--snow-color, white);
  border-radius: 50%;
  opacity: var(--opacity, 0.85);
  transform: translate(var(--x-start, 0vw), var(--y-start, -10px)) scale(var(--scale, 1));
  will-change: transform, opacity;
  filter: drop-shadow(0 0 calc(var(--size,8px) / 6) rgba(0,0,0,0.05));
  animation-name: fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  animation-duration: var(--dur, 12s);
  animation-delay: var(--delay, 0s);
}

/* Общий ключевой кадр использующий CSS-переменные, задаваемые per-element */
@keyframes fall {
  0% {
    transform: translate(var(--x-start, 0vw), -10px) scale(var(--scale,1));
    opacity: var(--opacity, 0.9);
  }
  50% {
    transform: translate(var(--x-mid, 0vw), var(--y-mid, 40vh)) scale(var(--scale,1));
    opacity: calc(var(--opacity, 0.9) * 0.95);
  }
  100% {
    transform: translate(var(--x-end, 0vw), 100vh) scale(var(--scale,1));
    opacity: 0.9;
  }
}

/* Варианты для темной темы (если у вас .dark на документе) */
.dark #snow-layer .snow {
  --snow-color: rgba(220,235,255,0.95);
  filter: drop-shadow(0 0 8px rgba(200,220,255,0.45));
}


    /* DARK THEME */
    .dark{--bg:#0f172a;--card:#1e293b;--muted:#cbd5e1;--primary:#60a5fa;--primary-dark:#3b82f6;--border:rgba(255,255,255,0.15);--shadow:rgba(0,0,0,0.3);color:#f1f5f9}
    .dark .hw{background:linear-gradient(135deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));border-color:rgba(255,255,255,0.1)}
    .dark .snow{background:rgba(200,220,255,0.85);box-shadow:0 0 12px rgba(200,220,255,0.6)}
    .dark input,.dark textarea,.dark select{background:#1e293b;color:#e2e8f0;border-color:rgba(255,255,255,0.1)}
    .dark .complete-btn{background:#1e293b;color:#e2e8f0}
    .dark .small{color:#cbd5e1}
    .dark .hw .title{color:#f1f5f9}
    .dark .section-title{color:#f1f5f9}
    .dark h1,h2,h3,h4{color:#f1f5f9}
    .dark .leaderboard{background:linear-gradient(135deg,rgba(59,130,246,0.1),rgba(139,92,246,0.1))}
    .dark .leaderboard .item{background:#1e293b;border:1px solid rgba(255,255,255,0.1)}
    .dark .leaderboard .item:hover{background:#334155}
    
    /* UTILITIES */
    .hidden{display:none!important}
    .error-msg{color:var(--danger);font-size:13px;margin-top:8px}
    .success-msg{color:var(--success);font-size:13px;margin-top:8px}
    .divider{height:1px;background:var(--border);margin:16px 0}
    
    /* RESPONSIVE */
    @media (max-width:1024px){
      .main{grid-template-columns:1fr;gap:16px}
      .sidebar{position:static;order:2}
      .content{order:1}
    }
    @media (max-width:640px){
      body{padding:12px}
      header{padding:16px;border-radius:12px}
      #logo-img{width:48px;height:48px;font-size:20px}
      h1{font-size:18px}
      .btn{padding:8px 14px;font-size:13px}
      .hw{padding:16px}
      .hw .title{font-size:16px}
      .modal{padding:20px;width:95%}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div id="logo-img">📚</div>
        <div>
          <h1 class="thetitle">Үй тапсырмалары</h1>
          <div class="small">Студенттерге арналған платформа</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="small" id="user-email"></div>
        <div class="small" id="user-points"></div>
        <div class="small" id="user-coins"></div>
        <button id="btn-logout" class="btn ghost hidden" onclick="logout()">Шығу</button>
        <button id="btn-show-auth" class="btn" onclick="showAuth()">Кіру / Тіркелу</button>
      </div>
    </header>

    <main id="app" class="main hidden">
      <aside class="sidebar">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div class="section-title">🔍 Іздеу</div>
          <button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="clearFilters()">Тазалау</button>
        </div>

        <div class="search">
          <input id="search" placeholder="Іздеу..." oninput="renderFilters()" />
          <select id="sort" onchange="renderFilters()">
            <option value="new">Жаңадан — ескіге</option>
            <option value="old">Ескідан — жаңға</option>
            <option value="deadline">Дедлайн бойынша</option>
            <option value="archive">Тек архив</option>
          </select>
        </div>

        <div class="section-title">📖 Пәндер</div>
        <div id="subject-list" class="subject-list"></div>

        <div class="leaderboard">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div class="section-title" style="margin:0">🏆 Рейтинг</div>
            <button class="btn ghost" style="padding:4px 10px;font-size:11px" onclick="openLeaderboardFull()">Толық</button>
          </div>
          <div id="leaderboard-list"></div>
          <div class="small" style="margin-top:12px;text-align:center">*Тапсырма орындаған сайын ұпай қосылады</div>
        </div>

        <div class="divider"></div>
        
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn ghost" onclick="openStore()">🎁 Кейстер</button>
          <button class="btn ghost" onclick="openEvents()">📝 СОР/СОЧ</button>
          <button class="btn ghost" onclick="openProfile()">👤 Профиль</button>
          <button class="btn ghost" onclick="openDonate()">💰 Донат</button>
        </div>

        <div class="small" style="margin-top:16px;text-align:center;opacity:0.7">v2.0 • Made with ❤️</div>
      </aside>

      <section class="content">
        <div class="content-header">
          <div>
            <h2 style="font-size:24px;margin-bottom:4px">Үй жұмыстары</h2>
            <div class="small">Барлығы: <strong id="count">0</strong> тапсырма</div>
          </div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <button class="btn ghost" onclick="reloadOnce()">🔄 Жаңарту</button>
            <button class="btn hidden" id="open-add" onclick="toggleAdd()">➕ Қосу</button>
          </div>
        </div>

        <div id="add-card" class="card hidden" style="margin-bottom:20px">
          <h4 style="margin-bottom:16px">Жаңа тапсырма қосу</h4>
          <form class="add-form" onsubmit="event.preventDefault();addHomework();" style="display:flex;flex-direction:column;gap:12px">
            <input id="hw-title" placeholder="Тақырып *" required />
            <select id="hw-subject" required>
              <option value="">Пән таңдаңыз *</option>
              <option>Ағылшын тілі</option>
              <option>Биология</option>
              <option>География</option>
              <option>Дүниежүзі тарихы</option>
              <option>Информатика</option>
              <option>Қазақ тілі мен әдебиеті</option>
              <option>Қазақстан тарихы</option>
              <option>Құқық негіздері</option>
              <option>Орыс тілі мен әдебиеті</option>
              <option>Математика</option>
              <option>Физика</option>
              <option>Химия</option>
            </select>
            <input id="hw-deadline" type="date" required />
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
              <input id="hw-requires-proof" type="checkbox" style="width:auto" />

    /* ===== Filters & list render ===== */
    function parseSearchDate(raw){
      const dateMatch = raw.match(/^\s*(\d{1,2})[.\-\/]?(\d{1,2})[.\-\/]?(\d{2,4})\s*$/);
      if(!dateMatch) return null;
      let day = Number(dateMatch[1]);
      let month = Number(dateMatch[2]);
      let year = Number(dateMatch[3]);
      if(year < 100) year += 2000;
      return new Date(year, month-1, day, 23,59,59,999);
    }

    function renderFilters(){
      const raw = el('search').value.trim();
      const q = raw.toLowerCase();
      const activeSub = document.querySelector('.subject-item.active')?.innerText?.replace(/[^\p{L}\s]/gu,'').trim() || 'Барлығы';
      const sort = el('sort').value;
      let items = lastSnapshot.slice();
      
      if(activeSub && activeSub !== 'Барлығы'){
        items = items.filter(x => String(x.subject || '').toLowerCase() === activeSub.toLowerCase());
      }
      if(sort === 'archive'){ items = items.filter(x => x.archived === true) }
      
      const parsedDate = parseSearchDate(raw);
      if(parsedDate){
        items = items.filter(x => {
          if(!x.deadline) return false;
          try{
            const d = (x.deadline && typeof x.deadline.toDate === 'function') ? x.deadline.toDate() : new Date(x.deadline);
            if(isNaN(d)) return false;
            return d <= parsedDate;
          }catch(e){ return false }
        });
      } else if(q){
        items = items.filter(x => (((x.title||'') + ' ' + (x.description||'') + ' ' + (x.authorEmail||'')).toLowerCase().includes(q)));
      }

      if(sort === 'deadline'){
        items.sort((a,b)=>{
          const da = (a.deadline && typeof a.deadline.toDate === 'function') ? a.deadline.toDate() : (a.deadline?new Date(a.deadline):new Date(8640000000000000));
          const db = (b.deadline && typeof b.deadline.toDate === 'function') ? b.deadline.toDate() : (b.deadline?new Date(b.deadline):new Date(8640000000000000));
          return da - db;
        });
      } else {
        items.sort((a,b)=>{
          const da = (a.createdAt && typeof a.createdAt.toDate === 'function') ? a.createdAt.toDate() : (a.createdAt?new Date(a.createdAt):new Date(0));
          const db = (b.createdAt && typeof b.createdAt.toDate === 'function') ? b.createdAt.toDate() : (b.createdAt?new Date(b.createdAt):new Date(0));
          return db - da;
        });
        if(sort === 'old') items.reverse();
      }
      
      el('count').innerText = items.length;
      renderList(items);
    }

    function renderList(items){
      const list = el('homework-list');
      list.innerHTML = '';
      if(items.length===0){
        list.innerHTML = '<div style="text-align:center;padding:60px 20px"><div style="font-size:48px;margin-bottom:16px">📭</div><div class="muted-italic">Тапсырма табылмады</div></div>';
        return;
      }
      items.forEach(d=>{
        const card=document.createElement('div');
        card.className='hw';
        
        const archiveBadge = d.archived ? '<span class="badge warning">Архив</span>' : '';
        const proofBadge = (d.requiresProof && !d.archived) ? '<span class="badge" style="background:rgba(245,158,11,0.1);color:var(--warning)">Доказ керек</span>' : '';
        
        card.innerHTML = `
          <div class="hw-header">
            <div style="flex:1;min-width:0">
              <div class="title">${escapeHtml(d.title||'Атауы жоқ')}</div>
              <div class="meta-info">
                <span class="badge">${escapeHtml(d.subject||'')}</span>
                ${archiveBadge}
                ${proofBadge}
              </div>
            </div>
            <div style="text-align:right">
              <div class="small" style="font-weight:600">📅 ${escapeHtml(formatDate(d.deadline||d.createdAt||''))}</div>
              <div class="small">от ${escapeHtml(d.authorEmail||'admin')}</div>
            </div>
          </div>
          ${d.description ? `<div class="desc">${escapeHtml(d.description)}</div>` : ''}
          <div class="actions" id="actions-${d.id}">
            <div class="small muted-italic" id="events-${d.id}"></div>
          </div>
        `;
        
        const actionsDiv = card.querySelector(`#actions-${d.id}`);
        const btns = document.createElement('div');
        btns.style.display = 'flex';
        btns.style.gap = '8px';
        btns.style.flexWrap = 'wrap';
        
        const completeBtn = makeCompleteButton(d.id,d);
        btns.appendChild(completeBtn);
        
        
        if(currentIsAdmin){
          const edit = document.createElement('button');
          edit.className='btn ghost';
          edit.innerText='✏️ Өңдеу';
          edit.onclick = ()=>{ editHomework(d) };
          const del = document.createElement('button');
          del.className='btn danger';
          del.innerText='🗑️ Жою';
          del.onclick = ()=>{ if(confirm('Жоюға сенімдісіз бе?')) db.collection('homework').doc(d.id).delete() };
          btns.appendChild(edit);
          btns.appendChild(del);
        }
        
        actionsDiv.appendChild(btns);
        list.appendChild(card);
        injectEventIndicator(d.id, d.deadline);
      });
    }
    async function submitProof(){
  const input = document.querySelector('#proof-file');
  const msgEl = document.querySelector('#proof-msg');
  const files = input?.files ? Array.from(input.files) : [];
  if(!files.length){ msgEl.innerHTML='<span class="error-msg">Выберите файл(ы)</span>'; return; }
  if(!pendingProofTarget || !pendingProofTarget.hwId){ msgEl.innerHTML='<span class="error-msg">Цель не определена</span>'; return; }
  if(!currentUser){ msgEl.innerHTML='<span class="error-msg">Нужно войти</span>'; return; }

  // базовые проверки: максимум 8 файлов, каждый до 8MB (поднимите если нужно)
  if(files.length > 8){ msgEl.innerHTML = '<span class="error-msg">Макс 8 файлов</span>'; return; }
  const MAX_SIZE = 8 * 1024 * 1024;
  const allowed = ['image/jpeg','image/png','image/webp','application/pdf','image/jpg','image/heic','image/heif'];
  for(const f of files){
    if(!allowed.includes(f.type)) { msgEl.innerHTML = '<span class="error-msg">Недопустимый формат (JPG/PNG/WEBP/PDF)</span>'; return; }
    if(f.size > MAX_SIZE){ msgEl.innerHTML = `<span class="error-msg">Файл ${f.name} слишком большой (макс ${MAX_SIZE/1024/1024}MB)</span>`; return; }
  }
  

  msgEl.innerHTML = '<span class="small">Загрузка...</span>';
  const hwId = pendingProofTarget.hwId;
  try{
    // --- 1) загрузка всех файлов в Cloudinary (или Firebase Storage) параллельно ---
    const uploadPromises = files.map((f, idx)=>{
      const url = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/upload`;
      const fd = new FormData();
      fd.append('file', f);
      fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      fd.append('context', `hwId=${hwId}&user=${currentUser.uid}`);
      return fetch(url, { method:'POST', body: fd }).then(async res=>{
        if(!res.ok){ const t = await res.text().catch(()=>null); throw new Error('Cloudinary error: '+(t||res.status)); }
        const j = await res.json();
        return { url: j.secure_url || j.url, id: j.public_id || `${Date.now()}_${f.name}` };
      });
    });

    const uploads = await Promise.all(uploadPromises);
    const urls = uploads.map(u=>u.url);
    const ids  = uploads.map(u=>u.id);

    // --- 2) атомарная проверка + начисление: только если ещё нет completion ---
    const uid = currentUser.uid;
    const statRef = db.collection('userStats').doc(uid);
    const compRef = statRef.collection('completed').doc(hwId);

    const awardPoints = 1;
    const awardCoins  = 5;

    let awarded = false;
    await db.runTransaction(async tx => {
      const compSnap = await tx.get(compRef);
      if(compSnap.exists){
        // уже есть completion — не начисляем повторно
        awarded = false;
        // обновим в документе completed поле proofUrls: добавим новые ссылки (merge)
        tx.set(compRef, {
          proofUrls: firebase.firestore.FieldValue.arrayUnion(...urls),
          proofIds: firebase.firestore.FieldValue.arrayUnion(...ids),
          updatedProofAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      } else {
        // создаём completion с 1 баллом и сохраняем proofUrls
        tx.set(compRef, {
          hwId,
          title: '',
          completedAt: firebase.firestore.FieldValue.serverTimestamp(),
          points: awardPoints,
          proofUrls: urls,
          proofIds: ids
        }, { merge: true });

        // увеличиваем агрегаты пользователя: +1 point и +5 coins
        tx.set(statRef, {
          points: firebase.firestore.FieldValue.increment(awardPoints),
          coins: firebase.firestore.FieldValue.increment(awardCoins),
          email: currentUser.email || '',
          displayName: (currentUser.email||'').split('@')[0],
          updated: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        awarded = true;
      }
    });

    // --- 3) Сохраняем отдельную запись submission для модерации / просмотра ---
    await db.collection('proofs').doc(hwId).collection('submissions').add({
      uid, displayName: currentUser.displayName || (currentUser.email||'').split('@')[0],
      imageUrls: urls, imageIds: ids,
      message: document.querySelector('#proof-text')?.value || '',
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // --- 4) UI refresh ---
    await loadUserCompleted(uid);
    await renderUserPoints(uid);
    renderLeaderboard();
    msgEl.innerHTML = `<span class="success-msg">✓ Загружено${awarded ? ', +1 балл и +5 монет' : ''}</span>`;
    setTimeout(()=>closeProofModal(), 1200);
  }catch(err){
    console.error('submitProof', err);
    msgEl.innerHTML = `<span class="error-msg">Ошибка: ${err.message||err}</span>`;
  }
}

    function makeCompleteButton(hwId, hwData){
  const btn = document.createElement('button');
  btn.className = 'complete-btn';
  if (!hwData) hwData = {};
  const done = completedMap && completedMap[hwId];
  if (done){
    btn.classList.add('done');
    btn.innerHTML = `✓ Орындадым (${pointsToDisplay(done.points||0)} ұпай)`;
  } else {
    btn.innerText = '✓ Орындадым';
  }

  btn.onclick = async () => {
    if (!currentUser) { alert('Кіру қажет'); return; }
    btn.disabled = true;

    try {
      const uid = currentUser.uid;
      const statRef = db.collection('userStats').doc(uid);
      const compRef = statRef.collection('completed').doc(hwId);

      // Получаем актуальные данные задания (не внутри транзакции — нужно знать, нужен ли proof)
      const hwDoc = await db.collection('homework').doc(hwId).get();
      const hw = hwDoc.exists ? hwDoc.data() : (hwData || {});
      const archived = !!hw.archived;
      const requiresProof = !!hw.requiresProof && !archived;

      // Если требуется доказательство — откроем модал и не делаем транзакцию
      if (requiresProof) {
        pendingProofTarget = { hwId };
        // убедись, что openProofModal глобальна
        if (typeof openProofModal === 'function') openProofModal(hwId);
        else alert('Функция открытия модалки доказательства не найдена');
        btn.disabled = false;
        return;
      }

      // Количество очков за это задание
      const pts = archived ? 0.5 : 1;
      const coinsToAdd = 5;

      // Транзакция — атомарно добавляем/удаляем completion и обновляем агрегаты пользователя
      // Пример корректной транзакции (заменяет вложенный db.runTransaction)
const txResult = await db.runTransaction(async (tx) => {
  const statRef = db.collection('userStats').doc(uid);
  const compRef = statRef.collection('completed').doc(hwId);

  // Получаем текущее состояние completion
  const compSnap = await tx.get(compRef);

  // Если есть completion — удаляем и откатываем очки
  if (compSnap.exists) {
    const prevPoints = Number(compSnap.data().points || 0);

    // Удаляем completion
    tx.delete(compRef);

    // Уменьшаем агрегат пользователя
    tx.set(statRef, {
      points: firebase.firestore.FieldValue.increment(-prevPoints),
      updated: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    return { action: 'removed', points: prevPoints };
  }

  // Иначе — добавляем completion и начисляем с учётом бустеров
  const pts = (typeof awardPoints !== 'undefined') ? awardPoints : 1;
  const coinsToAdd = (typeof awardCoins !== 'undefined') ? awardCoins : 5;

  // Получаем userStats в транзакции
  const userDoc = await tx.get(statRef);
  const userData = userDoc.exists ? userDoc.data() : {};
  let boosters = Array.isArray(userData.boosters) ? userData.boosters.slice() : [];

  // Вычисляем множитель (максимальный из активных)
  const now = Date.now();
  let multiplier = 1;
  for (let b of boosters) {
    const activeByTime = !b.duration || ((b.activatedAt || 0) + b.duration > now);
    const hasUses = (typeof b.uses === 'number') ? b.uses > 0 : true;
    if (activeByTime && hasUses && b.multiplier && Number(b.multiplier) > 1) {
      multiplier = Math.max(multiplier, Number(b.multiplier) || 1);
    }
  }

  // Если нужно — здесь можно также пометить toConsumeIds и уменьшить uses (см. прежний код),
  // но я оставляю это точкой расширения; при необходимости добавлю логику списания uses.

  const finalPts = Math.round(pts * multiplier);
  const finalCoins = Math.round(coinsToAdd * multiplier);

  // Создаём completion
  tx.set(compRef, {
    hwId: hwId,
    title: hw.title || '',
    subject: hw.subject || '',
    deadline: hw.deadline || '',
    completedAt: firebase.firestore.FieldValue.serverTimestamp(),
    points: finalPts
  }, { merge: true });

  // Обновляем агрегаты пользователя (points, coins, boosters если изменились)
  tx.set(statRef, {
    points: firebase.firestore.FieldValue.increment(finalPts),
    coins: firebase.firestore.FieldValue.increment(finalCoins),
    boosters: boosters,
    updated: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });

  return { action: 'added', points: finalPts, title: hw.title || '' };
}); // end runTransaction

// txResult теперь содержит { action: 'added'|'removed', points: number, title?: string }


      // После успешной транзакции — обновляем локальное состояние UI
      if (txResult.action === 'removed') {
        delete completedMap[hwId];
        btn.classList.remove('done');
        btn.innerText = '✓ Орындадым';
      } else if (txResult.action === 'added') {
        completedMap[hwId] = { hwId, title: txResult.title || (hw.title||''), points: txResult.points };
        btn.classList.add('done');
        btn.innerHTML = `✓ Орындадым (${pointsToDisplay(txResult.points||0)} ұпай)`;
        // обновляем виджеты
        await renderUserPoints(currentUser.uid).catch(()=>{});
        renderLeaderboard();
      }

    } catch (e) {
      console.error('complete toggle error', e);
      alert('Қате: ' + (e.message || e));
    } finally {
      btn.disabled = false;
    }
  };

  return btn;
}

async function openCaseAnimation(caseData, userId) {
  const overlay = document.createElement('div');
  overlay.className = 'case-opening';
  overlay.innerHTML = `
    <div style="text-align:center">
      <div class="case-box">🎁</div>
      <div style="color:#fff;font-size:24px;font-weight:700;margin-top:24px">${caseData.title}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  
  await new Promise(resolve => setTimeout(resolve, 2000));
  
  const items = caseData.items || [];
  const weights = items.map(item => {
    const rarityWeights = { common: 50, rare: 30, epic: 15, legendary: 5 };
    return rarityWeights[item.rarity] || 25;
  });
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  let random = Math.random() * totalWeight;
  let selectedItem = items[0];
  
  for (let i = 0; i < items.length; i++) {
    random -= weights[i];
    if (random <= 0) {
      selectedItem = items[i];
      break;
    }
  }
  
  overlay.querySelector('.case-box').style.animation = 'none';
  overlay.querySelector('.case-box').innerHTML = '✨';
  
  await new Promise(resolve => setTimeout(resolve, 500));
  
  const rarityColors = {
    legendary: 'linear-gradient(135deg, #ffd700, #ffed4e)',
    epic: 'linear-gradient(135deg, #a855f7, #7c3aed)',
    rare: 'linear-gradient(135deg, #3b82f6, #2563eb)',
    common: 'linear-gradient(135deg, #64748b, #475569)'
  };
  
  overlay.innerHTML = `
    <div class="prize-reveal" style="text-align:center;background:var(--card);padding:40px;border-radius:20px;max-width:400px">
      <div style="font-size:80px;margin-bottom:20px">${getItemIcon(selectedItem)}</div>
      <div style="font-size:24px;font-weight:700;margin-bottom:12px">${selectedItem.label}</div>
      <div class="badge" style="background:${rarityColors[selectedItem.rarity]};color:#fff;font-size:16px;padding:8px 16px">${selectedItem.rarity.toUpperCase()}</div>
      <div style="margin-top:24px">
        <button class="btn" onclick="this.closest('.case-opening').remove()">Забрать приз</button>
      </div>
    </div>
  `;
  // Перед await grantPrize(userId, selectedItem); добавь блокировку:
const lockKey = `case_opening_${userId}`;
if (window[lockKey]) {
  alert('Подождите завершения предыдущего открытия');
  overlay.remove();
  return;
}
window[lockKey] = true;

try {
  // даём приз ОДИН раз
  await grantPrize(userId, selectedItem);

  // Обновляем UI баланса сразу после выдачи приза
  try { await renderUserPoints(userId); } catch(e){ console.warn('renderUserPoints failed', e); }

} catch (e) {
  console.error('grantPrize error', e);

  // Попытка вернуть монеты пользователю (refund) — на случай, если grantPrize упал после списания
  try {
    await db.runTransaction(async (tx) => {
      const statRef = db.collection('userStats').doc(userId);
      const s = await tx.get(statRef);
      if (s.exists) {
        tx.update(statRef, { coins: firebase.firestore.FieldValue.increment(caseData.price) });
      } else {
        tx.set(statRef, { coins: caseData.price }, { merge: true });
      }
    });
    alert('Произошла ошибка при выдаче приза — монеты возвращены.');
  } catch (refundErr) {
    console.error('Refund failed', refundErr);
    alert('Ошибка: не удалось вернуть монеты автоматически. Напишите админу.');
  }

  throw e;
} finally {
  delete window[lockKey];
  // убираем оверлей (анимация)
  overlay.remove();
}
}

// Выдача приза
async function grantPrize(userId, item) {
  const statRef = db.collection('userStats').doc(userId);
  
  try {
    // Используем транзакцию для атомарности
    await db.runTransaction(async (tx) => {
      const userDoc = await tx.get(statRef);
      const userData = userDoc.exists ? userDoc.data() : {};
      
      if (item.type === 'badge') {
        const badges = userData.badges || [];
        if (!badges.includes(item.id)) {
          tx.update(statRef, {
            badges: firebase.firestore.FieldValue.arrayUnion(item.id)
          });
        } else {
          // Если уже есть - дать компенсацию 5 монет
          tx.update(statRef, {
            coins: firebase.firestore.FieldValue.increment(5)
          });
        }
      } else if (item.type === 'theme') {
        const themes = userData.themes || [];
        if (!themes.includes(item.id)) {
          tx.update(statRef, {
            themes: firebase.firestore.FieldValue.arrayUnion(item.id)
          });
        } else {
          tx.update(statRef, {
            coins: firebase.firestore.FieldValue.increment(8)
          });
        }
      } else if (item.type === 'avatar') {
        const avatars = userData.avatars || [];
        if (!avatars.includes(item.id)) {
          tx.update(statRef, {
            avatars: firebase.firestore.FieldValue.arrayUnion(item.id)
          });
        } else {
          tx.update(statRef, {
            coins: firebase.firestore.FieldValue.increment(10)
          });
        }
      } else if (item.type === 'booster') {
        const boosterData = {
          id: item.id + '_' + Date.now(), // Уникальный ID
          originalId: item.id,
          label: item.label,
          duration: item.duration || 0,
          uses: item.uses || 0,
          multiplier: item.multiplier || 1,
          activatedAt: Date.now()
        };
        tx.update(statRef, {
          boosters: firebase.firestore.FieldValue.arrayUnion(boosterData)
        });
      }
    });
  } catch (e) {
    console.error('grantPrize error', e);
    throw e;
  }
}

  if (item.type === 'theme') return '🎨';
  if (item.type === 'avatar') return item.id;
  if (item.type === 'booster') return '⚡';
  return '🎁';
}

function getBadgeRarity(badge) {
  const badgeText = String(badge).trim();
  const legendaryBadges = ['Легенда', 'Мифический', 'Король знаний', 'Император', 'Божественный', 'Космический', 'Звёздный', 'Новогодний'];
  const epicBadges = ['VIP', 'Элита', 'Мудрец', 'Молниеносный', 'Отличник', 'Чемпион', 'Радужный', 'Зимний', 'Весенний', 'Летний', 'Осенний', 'Прорицатель', 'Лунный', 'Волшебник', 'Иллюзионист'];
  const rareBadges = ['Активный', 'Целеустремлённый', 'Математик', 'Химик', 'Физик', 'География', 'Программист', 'Историк', 'Художник', 'Музыкант', 'Писатель', 'Актёр', 'Фотограф', 'Ветер', 'Спринтер'];
  if (legendaryBadges.some(b => badgeText.includes(b))) return 'legendary';
  if (epicBadges.some(b => badgeText.includes(b))) return 'epic';
  if (rareBadges.some(b => badgeText.includes(b))) return 'rare';
  return 'common';
}

    async function login(){
      const email = el('email').value.trim();
      const password = el('password').value;
      el('auth-msg').innerText='';
      if(!email || password.length < 6){ el('auth-msg').innerText='Қате: дұрыс деректер енгізіңіз'; return }
      try{
        await auth.signInWithEmailAndPassword(email, password);
        el('auth-msg').innerText='';
      }catch(e){
        console.error('login', e);
        el('auth-msg').innerText = 'Кіру сәтсіз: '+(e.message||e.code);
      }
    }

    async function register(){
      const email = el('email').value.trim();
      const password = el('password').value;
      el('auth-msg').innerText='';
      if(!email || password.length < 6){ el('auth-msg').innerText='Қате: дұрыс деректер енгізіңіз'; return }

// Рендер сетки аватарок
function renderAvatarGrid(containerId, avatars, currentAvatar, isPremium, unlockedList) {
  const container = document.querySelector(`#${containerId}`);
  if (!container) return;
  
  if (avatars.length === 0) {
    container.innerHTML = '<div class="small muted-italic" style="grid-column:1/-1">Нет аватарок</div>';
    return;
  }
  
  avatars.forEach(avatar => {
    const isLocked = isPremium && !unlockedList.includes(avatar);
    const div = document.createElement('div');
    div.className = `avatar-option ${currentAvatar === avatar ? 'selected' : ''} ${isLocked ? 'locked' : ''}`;
    div.textContent = avatar;
    
    div.onclick = async () => {
      if (isLocked) {
        if (confirm(`Купить эту аватарку за 50 монет?`)) {
          try {
            const statRef = db.collection('userStats').doc(currentUser.uid);
            await db.runTransaction(async tx => {
              const snap = await tx.get(statRef);
              const data = snap.data() || {};
              if ((data.coins || 0) < 50) throw new Error('Недостаточно монет');
              
              tx.update(statRef, {
                coins: firebase.firestore.FieldValue.increment(-50),
                premiumAvatars: firebase.firestore.FieldValue.arrayUnion(avatar),
                currentAvatar: avatar
              });
            });
            
            await renderUserPoints(currentUser.uid);
            document.querySelector('.modal-backdrop').remove();
            openAvatarPicker();
          } catch (e) {
            alert('Ошибка: ' + (e.message || e));
          }
        }
      } else {
        await db.collection('userStats').doc(currentUser.uid).update({
          currentAvatar: avatar
        });
        document.querySelector('#current-avatar').textContent = avatar;
        document.querySelector('.modal-backdrop').remove();
      }
    };
    
    container.appendChild(div);
  });
}

  <script>
(function(){
  const SNOW_COUNT = 70;        // сколько снежинок
  const SIZE_MIN = 5;           // px
  const SIZE_MAX = 12;
  const DUR_MIN = 8;            // s
  const DUR_MAX = 24;
  const SCALE_MIN = 0.5;
  const SCALE_MAX = 1.1;
  const OPACITY_MIN = 0.5;
  const OPACITY_MAX = 1.0;
  const X_OFFSET_MIN = -8;      // vw смещение по х (относительно начала) - позволяет "уноситься" влево/вправо
  const X_OFFSET_MAX = 8;       // vw

  let layer = document.getElementById('snow-layer');
  if (!layer) {
    layer = document.createElement('div');
    layer.id = 'snow-layer';
    document.body.appendChild(layer);
  }

  // Очистить старые
  layer.innerHTML = '';

  // Помощник — случайное число в диапазоне
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max+1)); }

  for (let i = 0; i < SNOW_COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'snow';

    // Случайные параметры
    const startX = rand(0, 100);            // стартовая позиция в vw
    const offset = rand(X_OFFSET_MIN, X_OFFSET_MAX); // куда смещается к концу (vw)
    const endX = startX + offset;
    const midX = startX + offset * 0.5;

    const size = Math.round(rand(SIZE_MIN, SIZE_MAX));
    const dur = rand(DUR_MIN, DUR_MAX);
    const delay = -rand(0, DUR_MAX);       // отрицательная задержка равномерно распределяет снежинки по анимации
    const scale = rand(SCALE_MIN, SCALE_MAX);
    const opacity = rand(OPACITY_MIN, OPACITY_MAX);
    const yMid = rand(20, 60);             // промежуточная высота (vh)

    // Позиция по вертикали старта (можно раскинуть по -30..0vh)
    const startY = -rand(0, 30);

    // Применяем CSS-переменные (используем vw/vh чтобы позиционировать относительно окна)
    s.style.setProperty('--x-start', startX + 'vw');
    s.style.setProperty('--x-mid', midX + 'vw');
    s.style.setProperty('--x-end', endX + 'vw');
    s.style.setProperty('--y-mid', yMid + 'vh');
    s.style.setProperty('--y-start', startY + 'vh');
    s.style.setProperty('--size', size + 'px');
    s.style.setProperty('--scale', scale);
    s.style.setProperty('--dur', dur + 's');
    s.style.setProperty('--delay', delay + 's');
    s.style.setProperty('--opacity', opacity);

    // Небольшая вариация формы (oval)
    if (Math.random() > 0.85) {
      s.style.borderRadius = '40%';
      s.style.width = (size * 1.2) + 'px';
      s.style.height = (size * 0.9) + 'px';
    }

    // Помещаем в слой
    layer.appendChild(s);
  }

  // Динамически обновлять количество при ресайзе — опционально
  window.addEventListener('resize', () => {
    // при желании можно пересоздать снежинки: spawnSnow(SNOW_COUNT);
    // но для простоты оставляем как есть.
  });

})();
