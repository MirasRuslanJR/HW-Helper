<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт более чем не доступен</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: white;
      overflow: hidden;
      position: relative;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      background: radial-gradient(ellipse at top, #1a1a2e 0%, #0a0a0f 50%);
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.3;
      animation: float 25s infinite ease-in-out;
    }

    .circle:nth-child(1) {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      top: -150px;
      left: -150px;
      animation-delay: 0s;
    }

    .circle:nth-child(2) {
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      bottom: -100px;
      right: -100px;
      animation-delay: 3s;
    }

    .circle:nth-child(3) {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      top: 40%;
      right: -150px;
      animation-delay: 6s;
    }

    .circle:nth-child(4) {
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, #fa709a, #fee140);
      bottom: 30%;
      left: -100px;
      animation-delay: 9s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.3;
      }
      25% {
        transform: translate(50px, -50px) scale(1.1);
        opacity: 0.4;
      }
      50% {
        transform: translate(-30px, 30px) scale(0.9);
        opacity: 0.25;
      }
      75% {
        transform: translate(30px, 50px) scale(1.05);
        opacity: 0.35;
      }
    }

    .grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(50px, 50px);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 650px;
      padding: 70px 50px;
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: slideIn 1s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .icon {
      width: 140px;
      height: 140px;
      margin: 0 auto 35px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      position: relative;
      animation: iconPulse 3s ease-in-out infinite;
      box-shadow: 
        0 0 30px rgba(102, 126, 234, 0.3),
        0 0 60px rgba(118, 75, 162, 0.2),
        inset 0 0 20px rgba(255, 255, 255, 0.05);
    }

    .icon::before {
      content: '';
      position: absolute;
      width: 160px;
      height: 160px;
      border: 2px solid rgba(102, 126, 234, 0.3);
      border-radius: 50%;
      animation: ripple 3s ease-out infinite;
    }

    @keyframes iconPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 
          0 0 30px rgba(102, 126, 234, 0.3),
          0 0 60px rgba(118, 75, 162, 0.2);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 
          0 0 40px rgba(102, 126, 234, 0.5),
          0 0 80px rgba(118, 75, 162, 0.3);
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    h1 {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: -2px;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff, #a0a0a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      opacity: 0.8;
      color: #b0b0b0;
    }

    .message {
      font-size: 17px;
      line-height: 1.8;
      opacity: 0.75;
      margin-bottom: 40px;
      color: #d0d0d0;
    }

    .divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, transparent, #667eea, #764ba2, transparent);
      margin: 35px auto;
      border-radius: 2px;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        opacity: 0.5;
        box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
      }
      50% {
        opacity: 1;
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
      }
    }

    .footer {
      font-size: 15px;
      opacity: 0.6;
      font-style: italic;
      color: #a0a0a0;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      animation: particleFloat 15s infinite;
      opacity: 0;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.5;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-100px) translateX(100px);
        opacity: 0;
      }
    }

    @media (max-width: 768px) {
      .container {
        margin: 20px;
        padding: 50px 35px;
      }

      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 19px;
      }

      .icon {
        width: 110px;
        height: 110px;
        font-size: 55px;
      }

      .message {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="grid"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="container">
    <div class="icon">💤</div>
    <h1>Сайт отключён</h1>
    <p class="subtitle">Срок: Навсегда</p>
    
    <div class="divider"></div>
    
    <p class="message">
      автор проекта решил закрыть сайт навсегда.<br>
      причина: автор осознал что сделал бессмысленный проект.<br>
      спасибо людям которые использовали сайт.
    </p>
    
    <p class="footer">
      — с уважением, m1ko
    </p>
  </div>

  <script>
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
      document.querySelector('.background').appendChild(particle);
    }
  </script>
</body>
</html>
